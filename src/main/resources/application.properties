spring.application.name=surge_pricing

# Configure Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=SurgePricingService
# Allow our own class types to be serialized/deserialized.
spring.kafka.consumer.properties.spring.json.trusted.packages=io.funnel_labs.surge_pricing
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.LongDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.LongSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
# Use virtual threads to dramatically lower the cost per thread for Spring Web MVC.
spring.threads.virtual.enabled=true
